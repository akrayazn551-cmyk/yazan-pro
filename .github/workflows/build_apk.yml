name: Build Yazan Pro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.5'
          cache: true

      - name: Save Main Backup
        run: |
          mkdir -p /tmp/backup
          cp lib/main.dart /tmp/backup/main.dart

      - name: Create Clean Flutter Project
        run: |
          flutter create . --org com.yazanpro.app --project-name yazan_pro
          echo "org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties

      - name: Restore Main File
        run: |
          cp /tmp/backup/main.dart lib/main.dart

      - name: Build APK Debug
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YazanPro-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          
