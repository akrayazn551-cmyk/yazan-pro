name: Build Yazan Pro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'

      - name: Save Main Backup
        run: mkdir -p backup && cp lib/main.dart backup/main.dart

      - name: Create Clean Flutter Project
        run: flutter create . --org com.yazanpro.app --project-name yazan_pro

      - name: Restore Main File
        run: cp backup/main.dart lib/main.dart

      - name: Build APK Release
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YazanPro-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          
