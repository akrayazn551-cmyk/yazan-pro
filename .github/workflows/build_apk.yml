name: Build Yazan Pro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'

      - name: Prepare Clean Project
        run: |
          mkdir -p temp_code
          cp lib/main.dart temp_code/main.dart
          rm -rf lib android ios web test pubspec.yaml
          flutter create . --org com.yazanpro.app --project-name yazan_pro
          cp temp_code/main.dart lib/main.dart

      - name: Build APK with Full Gradle Info Logs
        run: flutter build apk --debug --info

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YazanPro-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          
