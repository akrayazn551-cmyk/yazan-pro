name: Build Yazan Pro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses

      - name: Create Clean Project & Restore Main
        run: |
          mkdir -p temp_dir
          cp lib/main.dart temp_dir/main.dart
          flutter create . --org com.yazanpro.app --project-name yazan_pro
          cp temp_dir/main.dart lib/main.dart

      - name: Build APK Release with Verbose Logs
        run: flutter build apk --debug --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YazanPro-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          
