name: Generate Android Structure Permanently

on:
  workflow_dispatch:

jobs:
  setup-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'

      - name: Create Android Folder
        run: |
          flutter create . --platforms android --org com.yazanpro.app --project-name yazan_pro

      - name: Commit and Push Android Folder back to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add android/
          git commit -m "Add permanent android project structure" || exit 0
          git push
