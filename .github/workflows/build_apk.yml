name: Build Yazan Pro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'

      - name: Backup Custom Main
        run: cp lib/main.dart ./main_backup.dart

      - name: Create Clean Flutter Project
        run: flutter create . --org com.yazanpro.app --project-name yazan_pro

      - name: Add Shared Preferences Package
        run: flutter pub add shared_preferences

      - name: Restore Custom Main
        run: cp ./main_backup.dart lib/main.dart

      - name: Build APK Release
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YazanPro-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          
